# Enterprise 360 — performance test configuration
#
# Nothing environment-specific belongs in a .jmx file. Every value below is read by
# the plans through ${__P(name,default)}, so the same plans run against a laptop, a
# staging box or a customer-like environment with only this file changed.
#
#   jmeter -n -t jmeter/load.jmx -q config/perf.properties -l results/load.jtl
#
# NEVER point this at production. run.sh refuses a host it cannot verify as a test
# environment; see scripts/run.sh and README §Safety.

# ---- target -------------------------------------------------------------------
protocol=http
host=127.0.0.1
port=3000
connectTimeout=10000
responseTimeout=60000

# ---- data ---------------------------------------------------------------------
# CSVs generated by perf/seed-perf.mjs, perf/gen-roster.mjs and perf/mint-links.mjs.
dataDir=./data

# ---- concurrency --------------------------------------------------------------
# `users` is the TOTAL virtual users; each journey takes a fixed share of it
# (A 6% / B 14% / C 50% / D 25% / E 5%) so the workload mix is identical at every
# level. Change this one number to rescale a whole test.
#
#   baseline    5      uncontended reference
#   load       50      ordinary working day
#   peak      150      cycle opening / deadline day
#   stress    300+     past expected capacity, to find the knee
users=50
ramp=60
duration=600

# ---- credentials ---------------------------------------------------------------
# Deliberately NOT here. Passwords live in the CSV files under data/, which are
# generated for a throwaway database and are gitignored. If you need a different
# password, regenerate the data — do not hard-code one in a plan or a property file.

# ---- JMeter tuning -------------------------------------------------------------
# Raise if the load generator itself becomes the bottleneck (see README §Is it the
# app or the tool?). Rule of thumb: 1 GB heap per ~250 threads.
jmeter.save.saveservice.output_format=csv
jmeter.save.saveservice.response_data=false
jmeter.save.saveservice.samplerData=false
jmeter.save.saveservice.idle_time=true
jmeter.save.saveservice.connect_time=true
summariser.interval=30
