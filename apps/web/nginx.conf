# Nginx config for the Enterprise 360 SPA (F23).
# Serves the built static assets and proxies API + short-link paths to the api
# service. The /(r|qr)/ regex proxies short links while /reports, /radar etc.
# fall through to the SPA (mirrors the DEF-06 path-boundary fix).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API
    #
    # API responses are per-user and change the moment someone edits something, so
    # they must never be reused from cache. The API sends an ETag but no
    # Cache-Control, which leaves browsers free to apply heuristic caching — enough
    # for a corrected phone number or e-mail to keep reading as the old value after
    # it has already been saved.
    location /api/v1/ {
        add_header Cache-Control "no-store" always;
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Short links / QR (must be proxied, not served by the SPA).
    location ~ ^/(r|qr)/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Hashed build assets (app-BnuhLJ6X.js and friends) can be cached for ever:
    # any change produces a NEW filename, so a stale copy can never be served.
    location /assets/ {
        # One explicit header. `expires` would emit a second, conflicting Cache-Control.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html must NEVER be cached.
    #
    # It is the file that names the hashed bundles, so a browser holding an old copy
    # keeps requesting the OLD asset filenames and shows the previous build even
    # though the container has the new one. With no Cache-Control header at all —
    # which is what this file used to send — browsers fall back to heuristic caching
    # and do exactly that, making a rebuild look like it did nothing.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # SPA fallback. Client-side routes resolve to index.html, so they inherit the
    # no-cache rule above rather than the default.
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }
}
