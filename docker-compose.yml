# PostgreSQL + Redis ONLY — the two dependencies the from-source development
# workflow needs. The API, web and Mock SIS run on the host via start-dev.ps1 or
# `npm run dev:*`.
#
# This is NOT the full Docker stack. That is compose.yaml, which Docker Compose
# prefers by default, so:
#
#   docker compose up -d                        → the complete ecosystem (compose.yaml)
#   docker compose -f docker-compose.yml up -d  → just these two, for development
#   npm run db:up                               → the same two (pinned to this file)
#
# The two are alternatives. Running both publishes Postgres on the same host port.
services:
  postgres:
    image: postgres:16-alpine
    container_name: e360-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-enterprise360}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-enterprise360}']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: e360-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
volumes:
  pgdata:
  redisdata:
