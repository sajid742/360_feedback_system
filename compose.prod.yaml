# Production overlay. Apply on top of compose.yaml:
#
#   docker compose -f compose.yaml -f compose.prod.yaml up -d
#
# What it changes, and why:
#   - Mock SIS and WAHA are scaled to zero. Mock SIS is a test fixture whose /admin
#     page is deliberately unauthenticated; WAHA is optional and most production
#     tenants use Meta or Twilio instead. Keep WAHA by dropping its block here.
#   - PostgreSQL stops publishing a host port. Nothing outside the stack needs it,
#     and an exposed database is the single most common self-hosting mistake.
#   - The API stops publishing 3000. The browser reaches it through the web
#     container's nginx proxy at /api/v1, which is all it ever needed.
#   - No demo data.
#   - Modest resource ceilings so one runaway container cannot take the host down.
#
# Put a TLS-terminating reverse proxy (Caddy, Traefik, nginx) in front of `web` and
# set PUBLIC_APP_URL to its https:// address.

services:
  postgres:
    ports: !reset []

  api:
    ports: !reset []
    environment:
      LOG_LEVEL: warn
    deploy:
      resources:
        limits:
          memory: 1G

  web:
    ports:
      - '${WEB_PORT:-80}:80'

  db-init:
    environment:
      SEED_DEMO_DATA: 'false'

  mock-sis:
    deploy:
      replicas: 0

  waha:
    deploy:
      replicas: 0
